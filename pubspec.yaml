name: flowstate
description: Offline-first personal productivity, built one dependable milestone at a time.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.38.4'

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  sqlite3: ^3.1.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
